<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Memory Admin</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <h1>GitHub Memory Admin</h1>
        <p>Browse, export, and prune GitHub Copilot memory files from your local user, session, and repository stores.</p>
      </header>

      <section class="toolbar">
        <label>
          Scope
          <select id="scope">
            <option value="user">User memory</option>
            <option value="session">Session memory</option>
            <option value="repo">Repository memory</option>
          </select>
        </label>

        <label>
          Search
          <input id="search" placeholder="Filter memories" spellcheck="false" />
        </label>

        <div class="actions">
          <button id="refresh">Refresh</button>
          <button id="export">Export JSON</button>
        </div>
      </section>

      <section class="status" id="status">Ready.</section>
      <section class="summary">
        <div class="metric">
          <span class="label">Visible entries</span>
          <strong id="count">0</strong>
        </div>
        <div class="metric">
          <span class="label">Store path</span>
          <strong id="store-path">-</strong>
        </div>
        <div class="metric">
          <span class="label">Workspace</span>
          <strong id="workspace-path">-</strong>
        </div>
      </section>

      <section>
        <ul id="memories" class="memories"></ul>
      </section>
    </main>

    <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
      <form method="dialog" class="dialog-card">
        <h2 id="confirm-title">Delete memory</h2>
        <p id="confirm-message"></p>
        <menu>
          <button value="cancel" class="secondary-button">Cancel</button>
          <button value="confirm" id="confirm-delete" class="delete-button">Delete</button>
        </menu>
      </form>
    </dialog>

    <template id="memory-template">
      <li class="memory-card">
        <div>
          <h2 class="memory-title"></h2>
          <p class="memory-meta"></p>
          <p class="memory-body"></p>
        </div>
        <div class="memory-actions">
          <button class="delete-button">Delete</button>
        </div>
      </li>
    </template>

    <script type="module" src="/app.js"></script>
  </body>
</html>
